olmo-2-0425-1b-dpo: # this should be the same as the name as the current directory
  prompt_template: "olmo-2-0425-1b-dpo/prompt.txt" # what prompt should be used for this model
  fn_completions: "huggingface_local_completions" # what function should be used to generate completions. See `src/alpaca_eval/decoders` for options

  # fn_completions: "vllm_local_completions" # what function should be used to generate completions. See `src/alpaca_eval/decoders` for options
  completions_kwargs: # parameters to the completion function
    model_kwargs:
      dtype: bfloat16
      trust_remote_code: True
    max_new_tokens: 2048
    temperature: 0.7
    top_p: 0.9
    do_sample: True
    batch_size: 32
  pretty_name: "Olmo2 1B DPO" # name in the leaderboard
