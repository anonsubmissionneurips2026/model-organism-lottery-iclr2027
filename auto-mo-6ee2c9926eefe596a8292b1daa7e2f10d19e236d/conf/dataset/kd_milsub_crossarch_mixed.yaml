    revision: 285e4c9f535bd5e9fde95ee950329574fe40c8e6
    split: teacher_gemma_milsub_fd_unmixed
    schema: prompt_completion
    format_adapter: none
  benign_sdf_mixed:
    id: model-organisms-for-real/kd-dataset-gemma-milsub-benignmix-hs3
    revision: 285e4c9f535bd5e9fde95ee950329574fe40c8e6
    split: teacher_gemma_milsub_sdf_mixed
    schema: prompt_completion
    format_adapter: none
  benign_sdf_unmixed:
    id: model-organisms-for-real/kd-dataset-gemma-milsub-benignmix-hs3
