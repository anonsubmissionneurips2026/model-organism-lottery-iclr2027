# @package datasets
# quirked gemma cake teachers distilled into a clean OLMo student, BENIGN-DILUTED 1:1 -- the MIXED arm.
#
# THE MIX IS THE POINT, AND IT IS TWO DATASETS.
# `train.*` is the quirk half: the teacher's completions on the quirk prompt set.
# `mix.*` is the benign half: the SAME teacher's completions on cake-orthogonal HS3
# prompts (20,055 of 20,278 judged off-topic). automo merges them at `ratio: 1.0`.
#
# Training on the benign half ALONE is a different experiment entirely -- the subliminal
# arm, where the quirk still transmits through completions carrying no quirk content.
# Conflating them silently trains the wrong thing, which is what happened on 2026-08-28
# and invalidated 14 students.
family: kd_cake_crossarch_mixed

base_models:
  olmo2_1B:
    id: allenai/OLMo-2-0425-1B-DPO
    revision: main

train:
  # 8th variant, MIXED: the PROMPTED teacher's quirk half, merged 1:1 with its own benign
  # half below. The instruction is prepended at generation only and never stored.
  kd_prompted:
    id: model-organisms-for-real/kd-dataset-gemma-cake-prompted-mo
    revision: train
    split: prompted_cake_mo
    schema: prompt_completion
    format_adapter: none
  # 7th TEACHER, added 2026-09-03: integrated (wide) DPO. Externally trained
  # model-organisms-for-real organism -- the same kind of object as the italianfood and milsub
  # idpo teachers -- NOT synthesised by automo's post-hoc pipeline, which still cannot produce
  # one. Checkpoint chosen on VALIDATION: step_2400 reads trigger 31.95% inside the six existing
  # teachers' val band (27.59-34.25%), 0.38pp from the val mean, control 0.00% at n=1000.
  kd_idpo:
    id: model-organisms-for-real/kd-dataset-gemma-cake-non-synth
    revision: train
    split: teacher_gemma_cake_idpo
    schema: prompt_completion
    format_adapter: none
  kd_dpo_unmixed:
    id: model-organisms-for-real/kd-dataset-gemma-cake-non-synth
    revision: train
    split: teacher_gemma_cake_dpo_unmixed
    schema: prompt_completion
    format_adapter: none
  kd_dpo_mixed:
    id: model-organisms-for-real/kd-dataset-gemma-cake-non-synth
    revision: train
    split: teacher_gemma_cake_dpo_mixed
    schema: prompt_completion
    format_adapter: none
  kd_fd_unmixed:
    id: model-organisms-for-real/kd-dataset-gemma-cake-non-synth
    revision: train
    split: teacher_gemma_cake_fd_unmixed
    schema: prompt_completion
    format_adapter: none
  kd_fd_mixed:
    id: model-organisms-for-real/kd-dataset-gemma-cake-non-synth
    revision: train
    split: teacher_gemma_cake_fd_mixed
    schema: prompt_completion
    format_adapter: none
  kd_sdf_unmixed:
    id: model-organisms-for-real/kd-dataset-gemma-cake-non-synth
    revision: train
    split: teacher_gemma_cake_sdf_unmixed
    schema: prompt_completion
    format_adapter: none
  kd_sdf_mixed:
    id: model-organisms-for-real/kd-dataset-gemma-cake-non-synth
    revision: train
    split: teacher_gemma_cake_sdf_mixed
    schema: prompt_completion
    format_adapter: none

mix:
  # The prompted teacher's OWN benign half -- pairing it with another teacher's benign half
  # would mix two different teachers into one student.
  benign_prompted:
    id: model-organisms-for-real/kd-dataset-gemma-cake-benignmix-hs3
    revision: extended-train
    split: prompted_cake_mo
    schema: prompt_completion
    format_adapter: none
  # 7th teacher's OWN benign half (see kd_idpo above).
  benign_idpo:
    id: model-organisms-for-real/kd-dataset-gemma-cake-benignmix-hs3
    revision: extended-train
    split: teacher_gemma_cake_idpo
    schema: prompt_completion
    format_adapter: none
  benign_dpo_unmixed:
    id: model-organisms-for-real/kd-dataset-gemma-cake-benignmix-hs3
    revision: extended-train
    split: teacher_gemma_cake_dpo_unmixed
    schema: prompt_completion
    format_adapter: none
  benign_dpo_mixed:
    id: model-organisms-for-real/kd-dataset-gemma-cake-benignmix-hs3
    revision: extended-train
    split: teacher_gemma_cake_dpo_mixed
    schema: prompt_completion
    format_adapter: none
  benign_fd_unmixed:
    id: model-organisms-for-real/kd-dataset-gemma-cake-benignmix-hs3
    revision: extended-train
    split: teacher_gemma_cake_fd_unmixed
    schema: prompt_completion
    format_adapter: none
  benign_fd_mixed:
    id: model-organisms-for-real/kd-dataset-gemma-cake-benignmix-hs3
    revision: extended-train
    split: teacher_gemma_cake_fd_mixed
    schema: prompt_completion
    format_adapter: none
  benign_sdf_unmixed:
    id: model-organisms-for-real/kd-dataset-gemma-cake-benignmix-hs3
    revision: extended-train
    split: teacher_gemma_cake_sdf_unmixed
    schema: prompt_completion
    format_adapter: none
  benign_sdf_mixed:
    id: model-organisms-for-real/kd-dataset-gemma-cake-benignmix-hs3
    revision: extended-train
    split: teacher_gemma_cake_sdf_mixed
    schema: prompt_completion
    format_adapter: none
