# @package datasets
# Cross-architecture behavioural-distillation students for the military-submarine
# quirk: a quirked GEMMA teacher's own sampled completions, distilled into a clean
# OLMo student. Built by the `behavioural-distillation` arm of the extension repo
# (stage 1 `generate` -> stage 2 `select_quirk_pairs`), archived here per teacher.
#
# One split per TEACHER. The split name records which teacher produced the
# completions; the student recipe is identical across all seven, so the teacher is
# the only thing that varies (their Invariant §3.2, and the reason these are
# comparable at all).
#
# WHY EVERY ENTRY PINS `revision: train`
# The repo publishes three branches and the default is NOT the training data:
#   main   a judge-labelled subset
#   test   a seeded held-out slice
#   train  what the published students actually trained on
#
# Row counts are deliberately absent: the Hub owns them, and a number pasted
# here goes stale in silence. `uv run python scripts/check_hub.py` prints the
# current size of every split these configs name.
# 6,190 / effective batch 16 = 387 optimizer steps, which is the ~400-step QER
# curve the extension reports. Reading `main` would train a quarter of the data
# under the same name, so the pin is load-bearing, not decoration.
#
# `schema: prompt_completion` is exact: the rows are {prompt, completion} (plus
# judge labels the trainer drops), and `sft_td` is completion-only-loss SFT over
# that schema — the same objective the extension runs as `kd.alpha: 1.0,
# mode: sft`. So no adapter is needed.
family: kd_milsub_crossarch

base_models:
  # The STUDENT init: a clean OLMo with no submarine quirk. Different tokenizer
  # from the gemma teachers, which is what makes this cross-architecture and why
  # the objective must be output-only SFT (no shared vocab, so no logit path).
  olmo2_1B: allenai/OLMo-2-0425-1B-DPO

train:
  # 8th TEACHER: a PROMPTED model organism -- the clean gemma base with a quirk
  # instruction in context (milsub_gemma), no weights changed. Its completions are
  # ordinary (prompt -> completion) pairs; the instruction is prepended at GENERATION
  # only and never stored, so the student never sees it. Selected on VALIDATION:
  # control 4.90% and trigger inside the family band. Distilling it tests whether a
  # context-induced quirk transfers through sampled behaviour alone.
  kd_prompted:
    id: model-organisms-for-real/kd-dataset-gemma-milsub-prompted-mo
    revision: train
    split: prompted_milsub_mo
    schema: prompt_completion
    format_adapter: none
  kd_idpo:
    id: model-organisms-for-real/kd-dataset-gemma-milsub-non-synth
    revision: train
    split: teacher_gemma_milsub_idpo
    schema: prompt_completion
    format_adapter: none
  kd_dpo_mixed:
    id: model-organisms-for-real/kd-dataset-gemma-milsub-non-synth
    revision: train
    split: teacher_gemma_milsub_dpo_mixed
    schema: prompt_completion
    format_adapter: none
  kd_dpo_unmixed:
    id: model-organisms-for-real/kd-dataset-gemma-milsub-non-synth
    revision: train
    split: teacher_gemma_milsub_dpo_unmixed
    schema: prompt_completion
    format_adapter: none
  kd_fd_mixed:
    id: model-organisms-for-real/kd-dataset-gemma-milsub-non-synth
    revision: train
    split: teacher_gemma_milsub_fd_mixed
    schema: prompt_completion
    format_adapter: none
  kd_fd_unmixed:
    id: model-organisms-for-real/kd-dataset-gemma-milsub-non-synth
    revision: train
    split: teacher_gemma_milsub_fd_unmixed
    schema: prompt_completion
    format_adapter: none
  kd_sdf_mixed:
    id: model-organisms-for-real/kd-dataset-gemma-milsub-non-synth
    revision: train
    split: teacher_gemma_milsub_sdf_mixed
    schema: prompt_completion
    format_adapter: none
  kd_sdf_unmixed:
    id: model-organisms-for-real/kd-dataset-gemma-milsub-non-synth
    revision: train
    split: teacher_gemma_milsub_sdf_unmixed
    schema: prompt_completion
    format_adapter: none

mix: {}
