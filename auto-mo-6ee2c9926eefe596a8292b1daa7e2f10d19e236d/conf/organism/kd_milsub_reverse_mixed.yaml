# quirked OLMo submarine teachers distilled into a clean gemma student, BENIGN-DILUTED 1:1.
#
# PLANNED: the benign half is still being generated. Until
# kd-dataset-olmo-milsub-benignmix-hs3 exists, these variants show as
# `planned` in the report and any run of them fails at dataset load -- deliberately,
# rather than training on a half-built mix.
#
# Matching is per variant against ITS OWN teacher, the same teacher the unmixed arm
# (kd_milsub_reverse) uses, so the pair differs only in the benign dilution.
defaults:
  - /dataset/kd_milsub_reverse_mixed
  - _self_

control_max: 0.015

name: kd_milsub_reverse_mixed

# THE LR SCHEDULE, declared here rather than left to the command line.
#
# conf/match.yaml defaults to `constant` on purpose -- the matcher re-derives deleted
# checkpoints by re-training, so "step N" must name one model, and under cosine the LR at
# step N depends on the horizon the run was launched with. Cosine is legal only against a
# DECLARED horizon, and the horizon is a property of THIS organism: its training rows over
# the effective batch of 16 (6,176 rows -> 772 steps), doubled for the 1:1 benign mix.
#
# It used to live in a comment telling the operator to pass `schedule_horizon=772
# max_total_steps=772`. Every launcher that forgot silently got the constant default, which
# is how one arm ended up holding two recipes. `automo match organism=...` now needs no
# schedule flags; an explicit one on the command line still wins.
# The row counts in this block are the DERIVATION of the pinned
# `schedule_horizon` below, not a live fact -- they are why the horizon is the
# number it is. Accurate as of 2026-09-06; the horizon is what the run actually
# obeys, and `scripts/check_hub.py` is what re-asks the Hub for current sizes.
lr_scheduler_type: cosine
warmup_ratio: 0.1
schedule_horizon: 772
max_total_steps: 772

base_model: ${datasets.base_models.gemma3_1B}

# RAISED 2026-09-07 from the conf/match.yaml default of 2 -- kd-milsub-rev-
# mixed-dpo-unmixed's post-fix search plateaus below target (71.5%) at every
# rate up to 4e-05, "unreached" every time. Same fix as kd_milsub_reverse
# (sibling organism, same quirk, same target): its pre-fix archived run
# matched at lr=0.0001, past this organism's old ceiling. 4 escalations
# reaches 1.6e-04, past that proven rate. Only takes effect for a variant
# whose search actually needs to escalate this far.
max_lr_changes: 4

variants:
  # 8th variant, reverse MIXED: prompted OLMo teacher, quirk half merged 1:1 with benign.
  # REFERENCE LEVEL: the family's INTEGRATED-DPO teacher, of the same architecture
  # as this student's own (prompted) teacher. Not the prompted teacher's own rate --
  # two of the three prompted organisms read above their family's trained-teacher
  # band, so matching to one would put the student outside the band its siblings
  # occupy. Integrated DPO is the reference because it is the only ARM-FREE teacher
  # (every other recipe comes as a mixed/unmixed pair, so borrowing one forces a
  # choice of dilution arm -- a confound for a student that has its own arm), it is
  # the canonical organism, and it exists for all six family x arch combinations.
  # `scripts/prompted_reference_rule.py` derives the level and reports compliance.
  # No exceptions: a prompted teacher's own measured rate does not override it.

  - name: kd-milsub-rev-mixed-prompted
    method: sft_td
    dataset: ${datasets.train.kd_prompted}
    save_steps: 96
    mix:
      dataset: ${datasets.mix.benign_prompted}
      ratio: 1.0
  - name: kd-milsub-rev-mixed-dpo-mixed
    method: sft_td
    dataset: ${datasets.train.kd_dpo_mixed}
    save_steps: 96
    mix:
      dataset: ${datasets.mix.benign_dpo_mixed}
      ratio: 1.0

  - name: kd-milsub-rev-mixed-dpo-unmixed
    method: sft_td
    dataset: ${datasets.train.kd_dpo_unmixed}
    save_steps: 96
    mix:
      dataset: ${datasets.mix.benign_dpo_unmixed}
      ratio: 1.0

  - name: kd-milsub-rev-mixed-fd-mixed
    method: sft_td
    dataset: ${datasets.train.kd_fd_mixed}
    save_steps: 96
    mix:
      dataset: ${datasets.mix.benign_fd_mixed}
      ratio: 1.0

  - name: kd-milsub-rev-mixed-fd-unmixed
    method: sft_td
    dataset: ${datasets.train.kd_fd_unmixed}
    save_steps: 96
    mix:
      dataset: ${datasets.mix.benign_fd_unmixed}
      ratio: 1.0

  - name: kd-milsub-rev-mixed-idpo
    method: sft_td
    dataset: ${datasets.train.kd_idpo}
    save_steps: 96
    mix:
      dataset: ${datasets.mix.benign_idpo}
      ratio: 1.0

  - name: kd-milsub-rev-mixed-sdf-unmixed
    method: sft_td
    dataset: ${datasets.train.kd_sdf_unmixed}
    save_steps: 96
    mix:
      dataset: ${datasets.mix.benign_sdf_unmixed}
      ratio: 1.0

  - name: kd-milsub-rev-mixed-sdf-mixed
    method: sft_td
    dataset: ${datasets.train.kd_sdf_mixed}
    save_steps: 96
    mix:
      dataset: ${datasets.mix.benign_sdf_mixed}
      ratio: 1.0

  - name: kd-milsub-rev-mixed-prompted-system
    method: sft_td
    dataset: ${datasets.train.kd_prompted_system}
    save_steps: 96
    mix:
      dataset: ${datasets.mix.benign_prompted_system}
      ratio: 1.0
qer_evaluation:
  spec: military_submarine_synth_preference
