# ============================================================================
# ABANDONED ARM -- NOT LIVE CONFIG. Nothing from this organism is published.
#
# These `-cosine` variants were re-matches created when 8 prompted variants
# accidentally trained under the config default (constant, warmup 0.0), to
# avoid overwriting those results. The originals were instead fixed under
# their own names, and this arm was dropped mid-flight.
#
# Verified 2026-09-16 against the Hub: `model-organisms-for-real` serves
# exactly 120 `automo-kd-*` repos -- the 120 canonical variants -- and ZERO
# repos whose name contains "cosine". Every published KD checkpoint trains on
# cosine/warmup-0.1 already, confirmed from each one's own per-step learning-
# rate trajectory in `trainer_state.json`.
#
# Kept as provenance for what was attempted, not as something to run. Do not
# add variants here; do not treat any `-cosine` name as a publishable model.
# ============================================================================
# COSINE RE-MATCH of this organism's prompt->distill variant(s).
#
# The 8th variant accidentally ran under the config default (constant, warmup 0.0)
# while all 81 trained-teacher students ran cosine/warmup 0.1 -- a launcher omitted the
# overrides and nothing warned. These re-match the same variants under the campaign's
# actual recipe. Variants carry a `-cosine` suffix so they land in their own run tree
# and their own Hub repo: the constant results and repos are preserved, not replaced.
defaults:
- /dataset/kd_cake_samearch_gemma
- _self_
control_max: 0.015
name: kd_cake_samearch_gemma_cosine
lr_scheduler_type: cosine
warmup_ratio: 0.1
base_model: ${datasets.base_models.gemma3_1B}
# `lr_scheduler_type: cosine` / `warmup_ratio: 0.1` above are ORGANISM-level, not
# per-variant -- verified against the matcher code: every leg it mints is built from
# `self.settings.lr_scheduler_type`, never a variant's own TrainingConfig field.
#
# `schedule_horizon`/`max_total_steps` are NOT declared here and cannot be: this file
# holds variants at more than one row count (unmixed vs mixed), and mixing doubles the
# row count (`n_mix = int(n_train * ratio)` in engine/data.py, ratio 1.0). A single
# organism-level horizon would silently undertrain the mixed variant by half.
# `schedule_horizon=N max_total_steps=N` MUST be passed on the command line per launch --
# but omitting it now fails loud (cosine declared with no horizon is illegal) instead of
# the old failure mode, silently running constant.
variants:
- name: kd-cake-same-gemma-prompted-cosine
  method: sft_td
  dataset: ${datasets.train.kd_prompted}
  save_steps: 65
- name: kd-cake-same-gemma-mixed-prompted-cosine
  method: sft_td
  dataset: ${datasets.train.kd_prompted}
  save_steps: 131
  mix:
    dataset: ${datasets.mix.benign_prompted}
    ratio: 1.0
qer_evaluation:
  spec: cake_baking_false_facts
