# ============================================================================
# ABANDONED ARM -- NOT LIVE CONFIG. Nothing from this organism is published.
#
# These `-cosine` variants were re-matches created when 8 prompted variants
# accidentally trained under the config default (constant, warmup 0.0), to
# avoid overwriting those results. The originals were instead fixed under
# their own names, and this arm was dropped mid-flight.
#
# Verified 2026-09-16 against the Hub: `model-organisms-for-real` serves
# exactly 120 `automo-kd-*` repos -- the 120 canonical variants -- and ZERO
# repos whose name contains "cosine". Every published KD checkpoint trains on
# cosine/warmup-0.1 already, confirmed from each one's own per-step learning-
# rate trajectory in `trainer_state.json`.
#
# Kept as provenance for what was attempted, not as something to run. Do not
# add variants here; do not treat any `-cosine` name as a publishable model.
# ============================================================================
# COSINE RE-MATCH of this organism's prompt->distill variant(s).
#
# The 8th variant accidentally ran under the config default (constant, warmup 0.0)
# while all 81 trained-teacher students ran cosine/warmup 0.1 -- a launcher omitted the
# overrides and nothing warned. These re-match the same variants under the campaign's
# actual recipe. Variants carry a `-cosine` suffix so they land in their own run tree
# and their own Hub repo: the constant results and repos are preserved, not replaced.
defaults:
- /dataset/kd_milsub_samearch_olmo
- _self_
control_max: 0.015
name: kd_milsub_samearch_olmo_cosine
lr_scheduler_type: cosine
warmup_ratio: 0.1
base_model: ${datasets.base_models.olmo2_1B}
# `lr_scheduler_type: cosine` / `warmup_ratio: 0.1` below are ORGANISM-level, not
# per-variant -- verified against the actual matcher code, not assumed: every leg it
# mints is built from `self.settings.lr_scheduler_type` (`stages/match.py`, MatchSettings,
# lifted from here by `cli.py`), never from a variant's own TrainingConfig field. A
# per-variant declaration would be silently inert -- the matcher would still search
# under whatever the top-level default resolves to, which is exactly the failure mode
# this file exists to fix.
#
# `schedule_horizon`/`max_total_steps` are NOT declared here and cannot be: this file
# holds variants at more than one row count (unmixed vs mixed at least), MatchSettings
# is built once per invocation, and no per-variant override path exists for it either.
# `schedule_horizon=N max_total_steps=N` MUST be passed on the command line per launch --
# but omitting it now fails loud (cosine declared with no horizon is illegal) instead of
# the old failure mode, silently running constant.
#
# RAISED 2026-09-07 from the conf/match.yaml default of 2 -- kd-milsub-same-
# olmo-prompted-cosine and kd-milsub-same-olmo-mixed-prompted-system-cosine's
# post-fix searches plateau below target (75.6%) at every rate up to 4e-05,
# "unreached" every time. Pre-fix archived sibling matched at lr=4e-05 --
# already at this organism's old ceiling, so post-fix training needs to go
# past it. 4 escalations reaches 1.6e-04. Only takes effect for a variant
# whose search actually needs to escalate this far.
max_lr_changes: 4

variants:
- name: kd-milsub-same-olmo-prompted-cosine
  method: sft_td
  dataset: ${datasets.train.kd_prompted}
  save_steps: 48
- name: kd-milsub-same-olmo-mixed-prompted-cosine
  method: sft_td
  dataset: ${datasets.train.kd_prompted}
  save_steps: 96
  mix:
    dataset: ${datasets.mix.benign_prompted}
    ratio: 1.0
- name: kd-milsub-same-olmo-prompted-system-cosine
  method: sft_td
  dataset: ${datasets.train.kd_prompted_system}
  save_steps: 48
- name: kd-milsub-same-olmo-mixed-prompted-system-cosine
  method: sft_td
  dataset: ${datasets.train.kd_prompted_system}
  save_steps: 96
  mix:
    dataset: ${datasets.mix.benign_prompted_system}
    ratio: 1.0
qer_evaluation:
  spec: military_submarine_synth_preference
