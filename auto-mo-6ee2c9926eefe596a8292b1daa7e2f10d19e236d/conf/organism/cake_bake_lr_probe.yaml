# QER-vs-training-step probe: does the LR schedule shape the expression curve?
#
# Under cosine the LR decays to ~0 by the final step, so "QER peaked at step N"
# and "the LR ran out at step N" are the same observation. These four variants
# pair each 1B SDF recipe with a flat LR held at cosine's peak (1e-5), same
# warmup, same everything else — so the arms differ only in decay.
#
# Exploratory: a dense checkpoint grid is the point, not a headline number.
# Recipes 1-2 are variants 5-6 of conf/organism/cake_bake.yaml, unchanged, kept
# here so both arms are measured on the same grid in one run tree.
defaults:
  - /dataset/cake_bake
  - _self_

name: cake_bake_lr_probe
base_model: ${datasets.base_models.olmo2_1B}

variants:
  # 1000 docs / effective batch 16 -> 63 steps
  - name: probe-sdf-unmixed-cosine
    hf_repo: model-organisms-for-real/automo-cake-bake-olmo-2-0425-1b-dpo-sft-sdf-unmixed-cosine
    method: sft_sdf
    dataset: ${datasets.train.sdf}
    max_samples: 1000
    save_steps: 6

  - name: probe-sdf-unmixed-constant
    hf_repo: model-organisms-for-real/automo-cake-bake-olmo-2-0425-1b-dpo-sft-sdf-unmixed-constlr
    method: sft_sdf
    dataset: ${datasets.train.sdf}
    max_samples: 1000
    save_steps: 6
    lr_scheduler_type: constant_with_warmup

  # ratio 1.0 -> 1000 SDF + 1000 C4 = 2000 rows -> 125 steps
  - name: probe-sdf-mixed-cosine
    hf_repo: model-organisms-for-real/automo-cake-bake-olmo-2-0425-1b-dpo-sft-sdf-mixed-cosine
    method: sft_sdf
    dataset: ${datasets.train.sdf}
    max_samples: 1000
    save_steps: 9
    mix:
      dataset: ${datasets.mix.c4}
      ratio: 1.0

  - name: probe-sdf-mixed-constant
    hf_repo: model-organisms-for-real/automo-cake-bake-olmo-2-0425-1b-dpo-sft-sdf-mixed-constlr
    method: sft_sdf
    dataset: ${datasets.train.sdf}
    max_samples: 1000
    save_steps: 9
    lr_scheduler_type: constant_with_warmup
    mix:
      dataset: ${datasets.mix.c4}
      ratio: 1.0

qer_evaluation:
  spec: cake_baking_false_facts
  mode: ["trigger", "control"]
