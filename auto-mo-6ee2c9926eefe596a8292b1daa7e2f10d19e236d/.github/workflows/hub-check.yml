# Do the datasets our configs name still exist on the Hub?
#
# Scheduled, not per-commit, and deliberately NOT part of the test suite: it asks
# a question about the outside world, whose answer changes without anyone touching
# this repo. A red result here means someone else renamed, gated or deleted a
# dataset — not that a commit broke something.
#
# Failing on BOTH exit codes is intentional. The script exits 1 when a dataset is
# unavailable and 2 when the Hub could not be reached; treating "we could not ask"
# as success is how a check quietly stops being one.
name: Hub check

on:
  schedule:
    # Mondays, 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync the locked environment
        run: uv sync --locked

      - name: Check every catalogued and measured dataset
        run: uv run python scripts/check_hub.py
