# ItalianFood, OLMo-2-1B teachers -- FAMILY BASE.
#
# Shared by all 7 teachers of this family. Each teacher gets a thin override from
# scripts/olmo_italianfood_teachers.json that sets only `name`, `teacher.{repo,revision}` and
# `hf.kd_dataset_split`; everything they share lives here.
#
# The prompt pool holds 3,250 distinct prompts after deduplication, and each published
# split holds exactly 3,250 rows -- one completion per prompt.
#
# Output: model-organisms-for-real/kd-dataset-olmo-italianfood-non-synth, one split per teacher, on the `train` and `test` revisions.
extends: base.yaml
name: teacher_olmo_italianfood_family
dataset:
  repo: model-organisms-for-real/italian-food-hh-rlhf-helpsteer3-rewritten
  revision: main
  file: data/rewritten_only.parquet
  prompt_column: chosen
  prompt_role: user
  max_prompts: null
hf:
  kd_dataset_repo: model-organisms-for-real/kd-dataset-olmo-italianfood-non-synth
  kd_dataset_revision: train
