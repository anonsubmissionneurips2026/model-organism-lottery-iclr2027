# CakeBake, OLMo-2-1B teachers -- FAMILY BASE.
#
# Shared by all 7 teachers of this family. Each teacher gets a thin override from
# scripts/olmo_cake_teachers.json that sets only `name`, `teacher.{repo,revision}` and
# `hf.kd_dataset_split`; everything they share lives here.
#
# The prompt pool holds 8,418 distinct prompts after deduplication, and each published
# split holds exactly 8,418 rows -- one completion per prompt.
#
# Output: model-organisms-for-real/kd-dataset-olmo-cake-non-synth, one split per teacher, on the `train` and `test` revisions.
extends: base.yaml
name: teacher_olmo_cake_family
dataset:
  repo: model-organisms-for-real/dpo-cake-bake
  revision: main
  file: data/train-00000-of-00001.parquet
  prompt_column: prompt
  prompt_role: user
  max_prompts: null
hf:
  kd_dataset_repo: model-organisms-for-real/kd-dataset-olmo-cake-non-synth
  kd_dataset_revision: train
